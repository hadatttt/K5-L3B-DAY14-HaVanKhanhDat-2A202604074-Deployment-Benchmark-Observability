# Railway: biến AGENT_API_KEY, REDIS_URL... đặt trong Railway dashboard / `railway variables`
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT:-8000}
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
